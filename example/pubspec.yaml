name: gaiadesk_embed_example
description: "Acme Bank: a Get help button over gaiadesk_embed."
publish_to: 'none'

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  gaiadesk_embed:
    path: ../

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # The plugin ships a CocoaPods podspec (GaiaDeskEmbed is a pod); no SwiftPM.
  config:
    enable-swift-package-manager: false
